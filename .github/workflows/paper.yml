name: Paper trading

on:
  schedule:
    # GitHub runs schedules on a best-effort basis and skips many of them on quiet repos, so two
    # slots an hour are requested. Bars are replayed, so a late or skipped run loses nothing.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the paper-state branch into ./paper
        run: |
          if git ls-remote --exit-code origin paper-state >/dev/null; then
            git fetch --depth 1 origin paper-state
            git worktree add -B paper-state paper FETCH_HEAD
          else
            git worktree add --orphan -b paper-state paper
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one paper-trading tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional: enables LLM news scoring
        run: python -m tradebot.paper --dir paper

      - name: Run the trend track (acts once per daily close)
        run: python -m tradebot.trend paper --dir paper/trend

      - name: Save state
        working-directory: paper
        run: |
          git config user.name "paper-trader"
          git config user.email "paper-trader@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Paper tick $(date -u +%FT%RZ)"
          git push origin paper-state

      - name: Job summary
        run: cat paper/report.md paper/trend/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post alerts and the daily result to the log issue
        if: hashFiles('paper/daily.md', 'paper/alert.md', 'paper/trend/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Paper trading daily log in:title" --json number -q '.[0].number')
          post() {
            if [ -z "$n" ]; then
              n=$(gh issue create --title "Paper trading daily log" --body-file "$1" | grep -o '[0-9]*$')
            else
              gh issue comment "$n" --body-file "$1"
            fi
          }
          # An alert is deleted from the state branch only after it has been posted, so a failed
          # post leaves it in place for the next run to retry.
          for f in alert.md trend/alert.md; do
            if [ -f "paper/$f" ]; then
              post "paper/$f"
              git -C paper rm -q "$f"
              git -C paper commit -q -m "Alert posted: $f"
              git -C paper push -q origin paper-state
            fi
          done
          if [ -f paper/daily.md ]; then
            { echo; echo "---"; head -n 9 paper/trend/report.md; } >> paper/daily.md
            post paper/daily.md
          fi
