# Trading agent configuration. Only BTC-USD and ETH-USD are accepted.
products: [BTC-USD, ETH-USD]
starting_cash: 5000
timezone: America/New_York   # trading day and week reset at midnight Eastern

daily_target: 0.01           # stop for the day at +1%
daily_loss_cap: 0.01         # stop for the day at -1%
weekly_loss_shutdown: 0.05   # shut down at -5% on the week (manual reset required)
risk_per_trade: 0.005        # two attempts fit inside the daily cap
max_trades_per_day: 2

# Coinbase Advanced fees for this account (0.50% maker, 0.90% taker).
maker_fee: 0.005
taker_fee: 0.009
slippage: 0.0005
entry_order: limit           # resting limit orders pay the lower maker fee

news_enabled: true
news_block_hours: 6
reaction_drop: 0.015         # keyword warnings block only if BTC/ETH fell 1.5% in the last hour
reaction_range_ratio: 3.0    # ...or the last hour moved 3x its usual range
news_model: claude-opus-5-5  # used only when ANTHROPIC_API_KEY is set

# Best rule set from the parameter search (see README: the edge is not proven).
strategy:
  mode: breakout
  breakout_lookback: 672     # close above the 7-day high (15-minute bars)
  fast_ema: 384
  slow_ema: 1344
  trend_ema: 2000
  atr_len: 56
  stop_atr: 10.0
  trail_atr: 0.0
  exit_on_trend_break: true
