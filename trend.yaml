# Track 2: multi-day trend following with volatility-based sizing (see README).
product: BTC-USD
starting_cash: 5000
annual_target: 0.20        # goal is judged monthly against this pace
ma_windows: [50, 100, 200] # exposure = share of these daily averages the price is above
vol_window: 30
target_vol: 0.25           # position shrinks when the market is more volatile than this
rebalance_band: 0.20       # trade only when exposure is off by 20% of the account
drawdown_limit: 0.15       # go flat and pause 30 days at -15% from the peak
pause_days: 30
execution: taker           # trade at once at the taker fee (maker_first was tested and rejected)
fill_buffer: 0.001         # a resting order fills only if price trades 0.1% through it
slippage: 0.0005
